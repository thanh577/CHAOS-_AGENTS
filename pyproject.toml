[project]
name = "chaos"
version = "0.0.1"
description = "CHAOS — desktop AI agent (Milestone 0 Foundation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # AGENTS.md section 17 (DATABASE) mandates SQLAlchemy; stdlib sqlite3 is
    # insufficient as the standing persistence backend. Core API only.
    "SQLAlchemy>=2.0,<3",
]

[project.scripts]
chaos = "chaos.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
